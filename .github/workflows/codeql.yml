name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift security analysis
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      CODEQL_TOOLCHAINS: com.apple.dt.toolchain.Metal.32023 com.apple.dt.toolchain.XcodeDefault
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check pinned Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version)" = $'Xcode 26.0.1\nBuild version 17A400'
          xcodebuild -downloadComponent MetalToolchain

      - name: Mount Metal toolchain for traced builds
        run: bash scripts/mount_metal_toolchain.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Install locked CocoaPods dependencies
        run: pod install --deployment

      - name: Resolve locked Swift package dependencies
        run: |
          mkdir -p PhoneCoder.xcworkspace/xcshareddata/swiftpm
          cp OnDeviceLAS.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            PhoneCoder.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies \
            -workspace PhoneCoder.xcworkspace -scheme PhoneCoder \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/PhoneCoder-CodeQLSourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

      - name: Derive the native framework cache key
        id: native-cache-key
        run: |
          native_hash="$(
            {
              git submodule status
              git hash-object \
                Patches/llama.cpp-ios-only-xcframework.patch \
                scripts/build_native_frameworks.sh
            } | shasum -a 256 | awk '{ print $1 }'
          )"
          echo "key=native-ios-${RUNNER_OS}-${RUNNER_ARCH}-${native_hash}" >>"$GITHUB_OUTPUT"

      - name: Restore pinned native frameworks
        id: native-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ThirdParty/llama.cpp/build-apple/llama.xcframework
          key: ${{ steps.native-cache-key.outputs.key }}

      - name: Build pinned native inference frameworks
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_native_frameworks.sh --llama-only

      # CodeQL's macOS tracer currently hides Xcode 26's optional Metal
      # toolchain (github/codeql-action#3978). Compile package dependencies
      # and Metal resources first, then retain only those reviewed outputs.
      - name: Prime dependency and Metal build outputs before tracing
        run: |
          TOOLCHAINS="$CODEQL_TOOLCHAINS" xcodebuild \
            -workspace PhoneCoder.xcworkspace \
            -scheme PhoneCoder \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/PhoneCoder-CodeQLDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/PhoneCoder-CodeQLSourcePackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO SWIFT_USE_INTEGRATED_DRIVER=NO \
            build

      - name: Reset only first-party build outputs for analysis
        run: |
          rm -rf \
            "$RUNNER_TEMP/PhoneCoder-CodeQLDerivedData/Build/Intermediates.noindex/PhoneCoder.build" \
            "$RUNNER_TEMP/PhoneCoder-CodeQLDerivedData/Build/Products/Debug-iphonesimulator/Phone Coder.app"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Verify Metal toolchain under CodeQL tracing
        run: |
          xcrun metal -v
          TOOLCHAINS="$CODEQL_TOOLCHAINS" \
            "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/metal" -v

      - name: Build the iOS app for analysis
        run: |
          TOOLCHAINS="$CODEQL_TOOLCHAINS" xcodebuild \
            -workspace PhoneCoder.xcworkspace \
            -scheme PhoneCoder \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/PhoneCoder-CodeQLDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/PhoneCoder-CodeQLSourcePackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO SWIFT_USE_INTEGRATED_DRIVER=NO \
            build

      - name: Analyze Swift
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: /language:swift
